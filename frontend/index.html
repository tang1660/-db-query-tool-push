<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能数据库查询工具 · 含数据导出</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边导航：醒目、与功能区风格区分 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">DB</div>
        <div class="brand-text">
          <h1>智能数据库查询工具</h1>
          <span>AI · 查询 · 导出</span>
        </div>
      </div>

      <nav class="menu">
        <button class="menu-item active" data-tab="sql">
          <span class="mi-icon">SQL</span>
          <span class="mi-label">SQL 查询</span>
        </button>
        <button class="menu-item" data-tab="nl">
          <span class="mi-icon">AI</span>
          <span class="mi-label">自然语言查询</span>
        </button>
        <button class="menu-item" data-tab="auto">
          <span class="mi-icon">⇩</span>
          <span class="mi-label">一键查询并导出</span>
          <span class="mi-badge">自动化</span>
        </button>
        <button class="menu-item" data-tab="history">
          <span class="mi-icon">◷</span>
          <span class="mi-label">查询历史</span>
        </button>
      </nav>

      <div class="side-footer">
        <div class="conn-card">
          <label for="connSelect">当前数据库</label>
          <select id="connSelect"></select>
          <span id="connDesc" class="conn-desc"></span>
        </div>
        <div id="healthTag" class="health-tag checking">检测中…</div>
      </div>
    </aside>

    <!-- 主内容区：右侧面板，点击菜单切换，不跳转页面 -->
    <main class="main">
      <!-- SQL 查询 -->
      <section id="tab-sql" class="panel active">
        <header class="panel-head">
          <h2>SQL 查询</h2>
          <div class="head-actions">
            <button id="runSqlBtn" class="btn primary">▶ 执行查询</button>
          </div>
        </header>
        <div class="editor-wrap">
          <textarea id="sqlInput" placeholder="输入 SQL，例如：SELECT * FROM employees LIMIT 10;">SELECT * FROM employees LIMIT 10;</textarea>
        </div>
        <div id="resultArea" class="result-area empty">
          <p class="placeholder">执行查询后将在此显示结果。</p>
        </div>
        <div id="exportBar" class="export-bar hidden">
          <span class="eb-title">数据导出</span>
          <button id="exportCsvBtn" class="btn csv">⤓ 导出为 CSV</button>
          <button id="exportJsonBtn" class="btn json">⤓ 导出为 JSON</button>
          <span class="eb-tip">支持至少两种格式 · 一键下载</span>
        </div>
      </section>

      <!-- 自然语言查询 -->
      <section id="tab-nl" class="panel">
        <header class="panel-head">
          <h2>自然语言查询 <small>AI 助手</small></h2>
        </header>
        <div class="chat-box" id="chatBox">
          <div class="chat-msg ai">
            <div class="avatar">AI</div>
            <div class="bubble">
              你好！我是数据库查询助手。用自然语言告诉我你想查什么，我会翻译成 SQL 并执行。
              <div class="examples">
                <button class="ex-chip" data-prompt="统计每个部门的员工数量">统计每个部门的员工数量</button>
                <button class="ex-chip" data-prompt="查询薪水大于20000的员工">查询薪水大于20000的员工</button>
                <button class="ex-chip" data-prompt="查询价格低于300的商品">查询价格低于300的商品</button>
                <button class="ex-chip" data-prompt="按状态统计订单数量">按状态统计订单数量</button>
              </div>
            </div>
          </div>
        </div>
        <div class="chat-input">
          <input id="nlInput" type="text" placeholder="例如：查询薪资最高的前5名员工" />
          <button id="nlSendBtn" class="btn primary">发送</button>
        </div>
        <div id="nlResultArea" class="result-area empty hidden">
          <p class="placeholder">结果将在此显示。</p>
        </div>
      </section>

      <!-- 一键查询并导出（自动化） -->
      <section id="tab-auto" class="panel">
        <header class="panel-head">
          <h2>一键查询并导出 <small>自动化流程</small></h2>
        </header>
        <div class="auto-flow">
          <div class="flow-step" data-step="1">
            <span class="fs-no">1</span>
            <div class="fs-body">
              <label>自然语言</label>
              <input id="autoPrompt" type="text" value="统计每个部门的员工数量" />
            </div>
          </div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-step="2">
            <span class="fs-no">2</span>
            <div class="fs-body">
              <label>导出格式</label>
              <div class="fmt-choice">
                <label><input type="radio" name="autoFmt" value="csv" checked /> CSV</label>
                <label><input type="radio" name="autoFmt" value="json" /> JSON</label>
              </div>
            </div>
          </div>
          <div class="flow-arrow">→</div>
          <div class="flow-step" data-step="3">
            <span class="fs-no">3</span>
            <div class="fs-body">
              <label>操作</label>
              <button id="autoRunBtn" class="btn primary big">⚡ 一键执行：生成SQL → 查询 → 导出</button>
            </div>
          </div>
        </div>
        <div id="autoLog" class="auto-log">
          <p class="placeholder">点击按钮，观察 Agent 如何分解并协调"获取查询结果 / 格式化数据 / 创建文件"子任务。</p>
        </div>
      </section>

      <!-- 查询历史 -->
      <section id="tab-history" class="panel">
        <header class="panel-head">
          <h2>查询历史</h2>
          <div class="head-actions">
            <button id="refreshHistoryBtn" class="btn ghost">↻ 刷新</button>
          </div>
        </header>
        <div id="historyArea" class="history-area">
          <p class="placeholder">暂无历史记录。</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
